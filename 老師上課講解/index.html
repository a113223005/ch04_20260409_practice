<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天下茶屋 | 智慧點餐系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #2F4F2F;
            /* Matcha Green */
            --primary-hover: #1b301b;
            --accent-color: #D4AF37;
            /* Gold */
            --bg-color: #F8F5EE;
            /* Natural Paper */
            --card-bg: #FFFFFF;
            --text-dark: #2C2C2C;
            --text-light: #7A7A7A;
            --error-bg: #FFF2F2;
            --error-text: #D8000C;
            --success-text: #2F4F2F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgba(47, 79, 47, 0.05) 0%, rgba(248, 245, 238, 1) 90%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: fadeInSlight 0.8s ease-out forwards;
        }

        @keyframes fadeInSlight {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header Persona */
        .app-header {
            background-color: var(--primary-color);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .app-header::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: var(--primary-color) transparent transparent transparent;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .greeting {
            font-size: 0.9rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
        }

        .app-body {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Form Elements */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-light);
        }

        select,
        input[type="number"],
        input[type="text"] {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #E0E0E0;
            font-size: 1rem;
            background-color: rgba(248, 245, 238, 0.4);
            transition: all 0.3s ease;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: var(--primary-color);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(47, 79, 47, 0.1);
        }

        /* Checkboxes */
        .checkbox-group {
            display: flex;
            gap: 15px;
        }

        .checkbox-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid #E0E0E0;
            transition: all 0.2s;
        }

        .checkbox-item:hover {
            border-color: var(--primary-color);
        }

        .checkbox-item input {
            cursor: pointer;
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
        }

        /* Submit Button */
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(47, 79, 47, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        /* Message Box */
        #msgBox {
            margin-top: 10px;
        }

        .alert-error {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid var(--error-text);
            font-size: 0.9rem;
            line-height: 1.5;
            animation: slideIn 0.4s ease-out;
        }

        .summary-card {
            background-color: #F8F9FA;
            padding: 20px;
            border-radius: 16px;
            border: 1px dashed #DCDCDC;
            animation: slideIn 0.4s ease-out;
        }

        .summary-card h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--primary-color);
        }

        .summary-card p {
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .summary-card hr {
            border: none;
            border-top: 1px solid #E0E0E0;
            margin: 15px 0;
        }

        .summary-card h2 {
            font-size: 1.3rem;
            color: var(--text-dark);
            text-align: right;
        }

        .highlight-msg {
            color: var(--accent-color);
            font-size: 0.85rem !important;
            justify-content: flex-start !important;
        }

        .promo-msg {
            color: var(--success-text);
            font-weight: 500;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="app-container">
        <div class="app-header">
            <div class="brand-title">天下茶屋 APP</div>
            <div class="greeting">您好，歡迎使用天下茶屋智慧結帳系統</div>
        </div>

        <div class="app-body">
            <div class="form-row">
                <div class="form-group">
                    <label>選擇飲品</label>
                    <select id="product">
                        <option value="TEA_RED">天下紅茶 ($40)</option>
                        <option value="TEA_GRN">天下綠茶 ($35)</option>
                        <option value="MILK_TEA">特調奶茶 ($55)</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 0.4;">
                    <label>杯數</label>
                    <input type="number" id="qty" min="1" value="1">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>溫度</label>
                    <select id="temp">
                        <option value="ice">去冰 </option>
                        <option value="ice"> 微冰 </option>
                        <option value="ice"> 全冰</option>
                        <option value="hot">熱飲 (Hot)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>甜度</label>
                    <select id="sugar">
                        <option value="normal">正常糖</option>
                        <option value="less">少糖</option>
                        <option value="half">半糖</option>
                        <option value="none">無糖</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>加料區 (每項+$10/杯)</label>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="topping_boba"> 珍珠
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="topping_jelly"> 椰果
                    </label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>外送距離 (公里) - 店取填0</label>
                    <input type="number" id="distance" min="0" step="0.1" value="0">
                </div>
                <div class="form-group">
                    <label>促銷碼</label>
                    <input type="text" id="promo" placeholder="請輸入優惠碼">
                </div>
            </div>

            <button onclick="processOrder()">結帳 / 確認訂單</button>

            <!-- Workflow Progress UI -->
            <div id="workflowSteps" style="display:none; margin-top:20px;">
                <div
                    style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-light); margin-bottom:10px;">
                    <span id="step_S1">● 需求採集</span>
                    <span id="step_S2">● 規則校驗</span>
                    <span id="step_S3">● 金額結算</span>
                    <span id="step_S4">● 訂單確認</span>
                </div>
                <div style="height:4px; width:100%; background:#E0E0E0; border-radius:2px; position:relative;">
                    <div id="progressBar"
                        style="height:100%; width:0%; background:var(--primary-color); border-radius:2px; transition: width 0.3s ease;">
                    </div>
                </div>
            </div>

            <div id="msgBox"></div>
        </div>
    </div>

    <script>
        // System Knowledge Data
        const productData = {
            'TEA_RED': { name: '天下紅茶', price: 40 },
            'TEA_GRN': { name: '天下綠茶', price: 35 },
            'MILK_TEA': { name: '特調奶茶', price: 55 }
        };

        function updateWorkflowUI(step) {
            document.getElementById('workflowSteps').style.display = 'block';
            const steps = ['S1', 'S2', 'S3', 'S4'];
            const percentage = ((steps.indexOf(step) + 1) / steps.length) * 100;
            document.getElementById('progressBar').style.width = percentage + '%';

            steps.forEach(s => {
                const el = document.getElementById('step_' + s);
                if (s === step) {
                    el.style.color = 'var(--primary-color)';
                    el.style.fontWeight = '700';
                } else if (steps.indexOf(s) < steps.indexOf(step)) {
                    el.style.color = 'var(--primary-color)';
                    el.style.fontWeight = '400';
                } else {
                    el.style.color = 'var(--text-light)';
                    el.style.fontWeight = '400';
                }
            });
        }

        async function processOrder() {
            const msgBox = document.getElementById('msgBox');
            msgBox.innerHTML = ''; // Reset UI

            // S1: Query_Intent
            updateWorkflowUI('S1');
            await new Promise(r => setTimeout(r, 300));

            const productCode = document.getElementById('product').value;
            const qty = parseInt(document.getElementById('qty').value) || 1;
            const temp = document.getElementById('temp').value;
            const hasBoba = document.getElementById('topping_boba').checked;
            const hasJelly = document.getElementById('topping_jelly').checked;
            const distance = parseFloat(document.getElementById('distance').value) || 0;
            const promo = document.getElementById('promo').value.trim();

            // S2: Validate_Policy (Rules)
            updateWorkflowUI('S2');
            await new Promise(r => setTimeout(r, 400));

            // Rule 1: Topping Limit
            if (temp === 'hot' && hasBoba) {
                msgBox.innerHTML = '<div class="alert-error">很抱歉，基於茶飲品質堅持，熱飲暫不提供珍珠加購，建議您改選冰飲。</div>';
                return;
            }

            // Rule 2: Distance Limit
            if (distance > 5) {
                msgBox.innerHTML = '<div class="alert-error">不好意思，因超過距離不提供外送服務。</div>';
                return;
            }

            // S3: Calc_Price (Skills)
            updateWorkflowUI('S3');
            await new Promise(r => setTimeout(r, 500));

            const item = productData[productCode];

            // P1: Base calculation
            let subTotal = item.price * qty;

            // P2: Topping calculation
            let toppingCount = 0;
            let toppingNames = [];
            if (hasBoba) { toppingCount++; toppingNames.push('珍珠'); }
            if (hasJelly) { toppingCount++; toppingNames.push('椰果'); }

            let toppingCost = toppingCount * 10 * qty;
            let productTotal = subTotal + toppingCost;

            // Shipping fee calculation
            let shippingFee = 0;
            let shippingMsg = '';
            if (distance >= 2 && distance <= 5) {
                if (productTotal < 300) {
                    shippingFee = 50;
                    shippingMsg = '因外送距離較長加收50元外送費用。';
                }
            }

            // P3: Promo Code calc
            let promoDiscount = 0;
            let isPromoApplied = false;
            if (promo === 'TENKA_80') {
                promoDiscount = productTotal * 0.2;
                isPromoApplied = true;
            }

            let netTotal = (productTotal - promoDiscount) + shippingFee;

            // S4: Confirm_Order (Workflow Output)
            updateWorkflowUI('S4');

            let tempText = temp === 'hot' ? '熱飲' : '冰飲';
            let personaReminder = temp === 'hot' ? '<p class="highlight-msg" style="color:#e67e22; font-weight:500;">☕ 服務提醒：熱飲燙口，請小心飲用。</p>' : '';

            let summaryHTML = `
                <div class="summary-card">
                    <h3>訂單確認與摘要</h3>
                    ${personaReminder}
                    <p><span>飲品小計：</span> <span>${item.name} (${tempText}) x ${qty}</span></p>
                    <p><span>加料費用：</span> <span>${toppingNames.length > 0 ? toppingNames.join('、') : '無'} (+$${toppingCost})</span></p>
                    <p><span>商品總計：</span> <span>$${productTotal}</span></p>
            `;

            if (shippingFee > 0) {
                summaryHTML += `
                    <p><span>運費：</span> <span>$${shippingFee}</span></p>
                    <p class="highlight-msg">💡 提示：${shippingMsg}</p>
                `;
            } else {
                if (distance > 0) summaryHTML += `<p><span>運費：</span> <span>免運費</span></p>`;
            }

            if (isPromoApplied) {
                summaryHTML += `<p class="promo-msg"><span>✅ 優惠折抵：</span> <span>-$${promoDiscount} (TENKA_80)</span></p>`;
            }

            summaryHTML += `
                    <hr>
                    <h2>應付總額：$${netTotal}</h2>
                </div>
            `;

            msgBox.innerHTML = summaryHTML;
        }
    </script>

</body>

</html>
