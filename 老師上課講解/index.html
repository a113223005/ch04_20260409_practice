<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英雄茶屋 HERO TEA - 頂級手搖點餐</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-amber: #BC6C25; /* 深琥珀 */
            --light-amber: #DDA15E;   /* 淺琥珀 */
            --matcha-green: #606C38;  /* 抹茶綠 */
            --bg-glass: rgba(255, 255, 255, 0.25);
            --text-main: #283618;
            --white: #FEFAE0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Outfit', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(160deg, #606C38 0%, #283618 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* 模擬手機外殼 */
        .phone-mockup {
            width: 380px;
            height: 750px;
            background: var(--white);
            border-radius: 40px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
            overflow-y: auto;
            position: relative;
            padding: 20px;
        }

        /* 標題區 */
        header {
            text-align: center;
            padding: 20px 0;
        }

        h1 {
            color: var(--primary-amber);
            font-size: 28px;
            letter-spacing: 2px;
            margin: 0;
        }

        .persona-header {
            background: rgba(96, 108, 56, 0.1);
            padding: 15px;
            border-radius: 20px;
            margin: 15px 0;
            font-size: 13px;
            line-height: 1.6;
            border-left: 4px solid var(--matcha-green);
        }

        /* 品項卡片區 */
        .section-title {
            font-weight: 600;
            font-size: 18px;
            margin: 20px 0 10px;
        }

        .drink-grid {
            display: grid;
            gap: 15px;
        }

        .drink-card {
            background: white;
            border-radius: 25px;
            padding: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid transparent;
        }

        .drink-card.active {
            border-color: var(--primary-amber);
            background: #FFF9F2;
        }

        .drink-img {
            width: 70px;
            height: 70px;
            background: #F2F2F2;
            border-radius: 18px;
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .drink-info h3 { margin: 0; font-size: 16px; }
        .drink-info p { margin: 5px 0 0; color: var(--primary-amber); font-weight: 600; }

        /* 配置區 - 毛玻璃效果 */
        .config-overlay {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
        }

        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #DDD;
            margin-bottom: 10px;
            font-family: inherit;
        }

        .btn-checkout {
            background: var(--matcha-green);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(96, 108, 56, 0.3);
        }

        #feedback-area {
            background: #283618;
            color: white;
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
            font-size: 13px;
            display: none;
            animation: slideUp 0.4s;
        }

        @keyframes slideUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>

<div class="phone-mockup">
    <header>
        <h1>HERO TEA</h1>
        <div class="persona-header">
            <strong>👨‍💼 店務經理說：</strong><br>
            您好！我們選用頂級原葉茶，為您沖泡每一杯英雄之味。今天想嘗試哪一款經典呢？
        </div>
    </header>

    <div class="section-title">經典推薦菜单</div>
    <div class="drink-grid">
        <div class="drink-card" onclick="selectDrink('英雄紅茶', 40, this)">
            <div class="drink-img">☕</div>
            <div class="drink-info">
                <h3>英雄紅茶</h3>
                <p>NT$ 40</p>
            </div>
        </div>
        <div class="drink-card" onclick="selectDrink('珍珠鮮奶茶', 55, this)">
            <div class="drink-img">🧋</div>
            <div class="drink-info">
                <h3>珍珠鮮奶茶</h3>
                <p>NT$ 55</p>
            </div>
        </div>
        <div class="drink-card" onclick="selectDrink('琥珀青茶奶蓋', 60, this)">
            <div class="drink-img">🥛</div>
            <div class="drink-info">
                <h3>琥珀青茶奶蓋</h3>
                <p>NT$ 60</p>
            </div>
        </div>
    </div>

    <div class="config-overlay">
        <div style="font-weight: 600; margin-bottom: 10px;">客製化調整 (Rules)</div>
        <select id="sugar">
            <option value="">選擇甜度 (必填)</option>
            <option value="全糖">全糖</option>
            <option value="半糖">半糖</option>
            <option value="無糖">無糖</option>
        </select>
        <select id="ice">
            <option value="">選擇冰塊 (必填)</option>
            <option value="正常冰">正常冰</option>
            <option value="微冰">微冰</option>
            <option value="熱飲">熱飲</option>
        </select>
        <div style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="topping" style="width: auto; margin:0;">
            <label for="topping" style="font-size: 13px;">加蜂蜜珍珠 (+NT$10)</label>
        </div>

        <button class="btn-checkout" onclick="checkout()">確認送單</button>
        
        <div id="feedback-area"></div>
    </div>
</div>

<script>
    let selectedDrink = null;
    let basePrice = 0;

    function selectDrink(name, price, element) {
        selectedDrink = name;
        basePrice = price;
        document.querySelectorAll('.drink-card').forEach(c => c.classList.remove('active'));
        element.classList.add('active');
    }

    function checkout() {
        const sugar = document.getElementById('sugar').value;
        const ice = document.getElementById('ice').value;
        const hasTopping = document.getElementById('topping').checked;
        const feedback = document.getElementById('feedback-area');

        // --- Rules 實作 ---
        if (!selectedDrink) { alert("⚠️ 請先挑選您想喝的英雄品項！"); return; }
        if (!sugar || !ice) { alert("⚠️ 店長溫馨提示：別忘了調整您的甜度與冰塊喔！"); return; }
        
        if (ice === "熱飲" && hasTopping) {
            alert("⚠️ 專業提醒：熱飲加珍珠會使珍珠口感變軟，還是要幫您加入嗎？");
        }

        // --- Skills 實作 ---
        let total = basePrice + (hasTopping ? 10 : 0);

        // --- Persona 實作 ---
        feedback.style.display = "block";
        feedback.innerHTML = `
            <strong>✨ 訂單已成功送達！</strong><br>
            品項：${selectedDrink}<br>
            設定：${sugar} / ${ice}<br>
            加料：${hasTopping ? '蜂蜜珍珠' : '無'}<br>
            <strong>總計：NT$ ${total}</strong><br><br>
            <em>太棒了！店長正在親自為您沖泡中，請稍候！</em>
        `;
    }
</script>

</body>
</html>
